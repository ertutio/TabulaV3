name: Verify glass checks on AOSP emulator images

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  device:
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: 35
            mode: viewer
          - api: 33
            mode: probe
          - api: 35
            mode: probe
    name: AOSP API ${{ matrix.api }} ${{ matrix.mode }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'
      - name: Download #106 debug APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 46048798698 --repo "$GITHUB_REPOSITORY" \
            --name Tabula-liquid-glass-8063998e8f55f20688e83af4b15592599786f356 --dir input/
          mkdir -p app/build/outputs/apk/debug app/build/outputs/apk/androidTest/debug device-results
          cp input/artifacts/TabulaV3-liquid-glass-debug.apk app/build/outputs/apk/debug/app-debug.apk
          cp input/artifacts/TabulaV3-liquid-glass-androidTest.apk app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk
      - name: Enable KVM and sample host memory
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          nohup bash -c 'while true; do
            date -u +%FT%TZ
            free -m | sed -n "2p"
            cat /sys/fs/cgroup/memory.events 2>/dev/null || true
            ps -eo pid,comm,rss,pcpu | grep -E "qemu-system|emulator" || true
            sleep 3
          done' > device-results/host-samples.txt 2>&1 </dev/null &
          echo "$!" > device-results/host-sampler.pid
      - name: Install preview probe dependencies
        run: python -m pip install --disable-pip-version-check Pillow==10.4.0
      - name: Run the existing glass assertions
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: ${{ matrix.api }}
          target: default
          arch: x86_64
          profile: pixel_6
          cores: 2
          ram-size: 3072M
          disk-size: 8G
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -no-metrics
          disable-animations: true
          script: API_LEVEL=${{ matrix.api }} MODE=${{ matrix.mode }} bash tools/run-emulator-evidence.sh
      - name: Check host kernel for emulator exits
        if: always()
        run: |
          if test -f device-results/host-sampler.pid; then
            kill "$(cat device-results/host-sampler.pid)" || true
          fi
          sudo dmesg --ctime | grep -Ei 'oom|out of memory|killed process|segfault|qemu' > device-results/host-kernel.txt || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: glass-aosp-${{ matrix.api }}-${{ matrix.mode }}
          path: device-results/
          if-no-files-found: warn
          retention-days: 7
