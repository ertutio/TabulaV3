name: Diagnose glass emulator process exit

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  device:
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: swiftshader-no-guest-vulkan
            gpu_options: '-gpu swiftshader -feature -Vulkan'
          - label: swangle-no-guest-vulkan
            gpu_options: '-gpu swangle -feature -Vulkan'
    name: API 35 viewer (${{ matrix.label }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'
      - name: Download the previously published preview's test build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 46037164689 --repo "$GITHUB_REPOSITORY" \
            --name Tabula-liquid-glass-8c7898b36946295e04c4f4592002a8c43f5fdaa8 --dir input/
          mkdir -p app/build/outputs/apk/debug app/build/outputs/apk/androidTest/debug device-results
          cp input/artifacts/TabulaV3-liquid-glass-debug.apk app/build/outputs/apk/debug/app-debug.apk
          cp input/artifacts/TabulaV3-liquid-glass-androidTest.apk app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
      - name: Enable KVM and sample host memory
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          nohup bash -c 'while true; do
            date -u +%FT%TZ
            free -m | sed -n "2p"
            cat /sys/fs/cgroup/memory.events 2>/dev/null || true
            ps -eo pid,comm,rss,pcpu | grep -E "qemu-system|emulator" || true
            sleep 3
          done' > device-results/host-samples.txt 2>&1 </dev/null &
          echo "$!" > device-results/host-sampler.pid
      - name: Run the existing viewer assertions
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 2
          ram-size: 3072M
          disk-size: 8G
          emulator-options: -no-window ${{ matrix.gpu_options }} -no-snapshot -noaudio -no-boot-anim -no-metrics
          disable-animations: true
          script: API_LEVEL=35 MODE=viewer VIEWER_ATTEMPTS=1 bash tools/run-emulator-evidence.sh
      - name: Check host kernel for emulator exits
        if: always()
        run: |
          if test -f device-results/host-sampler.pid; then
            kill "$(cat device-results/host-sampler.pid)" || true
          fi
          sudo dmesg --ctime | grep -Ei 'oom|out of memory|killed process|segfault|qemu' > device-results/host-kernel.txt || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: glass-emulator-diagnostic-${{ matrix.label }}
          path: device-results/
          if-no-files-found: warn
          retention-days: 7
