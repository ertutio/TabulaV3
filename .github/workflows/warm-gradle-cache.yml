name: Warm Gradle dependency cache

on:
  push:
    branches: [master]
    paths:
      - '**/*.gradle*'
      - '**/gradle-wrapper.properties'
      - 'buildSrc/**/Versions.kt'
      - 'buildSrc/**/Dependencies.kt'
      - 'gradle/*.versions.toml'
      - '**/versions.properties'
      - '.github/workflows/warm-gradle-cache.yml'
      - 'tools/run-ci-gradle.sh'
      - 'tools/tests/test_run_ci_gradle.sh'
  pull_request:
    branches: [master]
    paths:
      - '.github/workflows/warm-gradle-cache.yml'
      - 'tools/run-ci-gradle.sh'
      - 'tools/tests/test_run_ci_gradle.sh'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: warm-gradle-cache-${{ github.ref }}
  cancel-in-progress: true

jobs:
  warm:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Test retry behavior
        run: bash tools/tests/test_run_ci_gradle.sh
      - name: Install Android SDK packages
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;35.0.0"'
      - name: Populate Gradle dependency cache
        run: |
          bash tools/run-ci-gradle.sh --no-daemon --stacktrace \
            :app:assembleDebug :app:assembleRelease :app:assembleDebugAndroidTest \
            :app:compileDebugUnitTestKotlin :app:compileReleaseUnitTestKotlin
