name: Publish verified Tabula 4.0.1 preview

on: workflow_dispatch

permissions:
  actions: read
  contents: write

concurrency:
  group: publish-tabula-v4.0.1-preview
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'ertutio/TabulaV3' && github.ref == 'refs/heads/ci/publish-v4.0.1-preview'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      TABULA_TAG: V4.0.1-preview
      TABULA_RELEASE_SHA: 9904af78905a10e857cf286e3d3cca9aadccc081
      TABULA_SIGN_RUN: '46053206827'
      TABULA_SIGN_BASE: 734d36de62bbe081a761a0ed90f74498a6e623d3
      TABULA_ASSET: TabulaV3-4.0.1-preview-code8-signed.apk
      TABULA_ASSET_SHA256: 55e7c0b678123c25b598c500abc8d43bf19021e5ab72a7d19f2378e7f3c441b2
    steps:
      - name: Check signing provenance and publish
        shell: bash
        run: |
          set -euo pipefail
          repo="repos/$GITHUB_REPOSITORY"
          gh api "$repo/actions/runs/$TABULA_SIGN_RUN" | jq -e --arg base "$TABULA_SIGN_BASE" --arg repo "$GITHUB_REPOSITORY" '
            .path == ".github/workflows/sign-preview-apk.yml" and .head_sha == $base and .head_repository.full_name == $repo and
            .event == "workflow_dispatch" and .status == "completed" and .conclusion == "success"'
          test "$(gh api "$repo/git/ref/heads/release/v4.0.1-preview" --jq .object.sha)" = "$TABULA_RELEASE_SHA"
          if gh release view "$TABULA_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "The preview release already exists." >&2
            exit 1
          fi
          stage=$(mktemp -d)
          gh run download "$TABULA_SIGN_RUN" --repo "$GITHUB_REPOSITORY" \
            --name TabulaV3-4.0.1-preview-signed --dir "$stage"
          cd "$stage"
          sha256sum --check SHA256SUMS-preview.txt
          test "$(sha256sum "$TABULA_ASSET" | cut -d ' ' -f 1)" = "$TABULA_ASSET_SHA256"
          grep -Fxq "Source SHA: $TABULA_RELEASE_SHA" BUILD.txt
          grep -Fxq 'Build run: 46052129666' BUILD.txt
          cat > notes.md <<'NOTES'
          ## 液态玻璃改进

          - 修复深色模式下设置和教程的文字对比度。浅色设置分组的底色和边缘更容易分辨。
          - 移除首页、图集和查看器玻璃操作按钮上的横向反光条。小按钮使用柔和的圆角高光，设置图标直接绘制在玻璃卡片上。
          - 设置列表滚到固定标题下方时，顶栏出现渐隐磨砂层。窄屏或大字体下，设置值可以排到标题下方。

          ## 预览验收

          在 Android 15 或更高版本上，从「设置 → 实验室 → 液态玻璃主题」开启效果，分别检查浅色和深色下的设置页、滚动时的标题栏，以及首页和查看器的玻璃按钮。

          此包沿用 4.0 预览版签名，版本号为 `4.0.1-preview`，版本代码为 `8`。#106 的云端构建和单测已通过。部分 API 33、API 35 模拟器设备检查在装包后中断，外观和手势留待实机验收。
          NOTES
          gh release create "$TABULA_TAG" "$TABULA_ASSET" SHA256SUMS-preview.txt \
            --repo "$GITHUB_REPOSITORY" --target "$TABULA_RELEASE_SHA" --prerelease --latest=false \
            --title "Tabula 4.0.1 预览版" --notes-file notes.md
