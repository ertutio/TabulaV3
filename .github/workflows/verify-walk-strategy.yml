name: Verify walk strategy on emulator

on:
  push:
    branches: [feature/source-balance-2026-11-23]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: walk-strategy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Install build SDK
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;35.0.0"'
      - name: Pre-fetch Robolectric android-all jars
        run: |
          # 与其余工作流共用同一脚本，行为一致。
          bash tools/prefetch-robolectric-jar.sh

      - name: Unit regressions, app APK and instrumented APK
        run: bash ./gradlew --no-daemon --stacktrace :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest
      # 取证脚本自身的退出码语义：不碰模拟器就能验证
      # （run 45372299838 的语法错误 + 恒空 INSTRUMENT_EXIT 都是这么来的）
      - name: Walk strategy evidence script semantics
        run: |
          set -euo pipefail
          bash -n tools/run-walk-strategy-evidence.sh
          sh -n tools/run-walk-strategy-evidence.sh
          python3 -m unittest discover -s tools/tests \
            -p "test_walk_strategy_evidence_script.py" -v

      - name: Collect artifacts
        run: |
          mkdir -p device-apks artifacts
          cp app/build/outputs/apk/debug/app-debug.apk device-apks/
          cp app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk device-apks/
          python3 - <<'PY' | tee artifacts/test-counts.txt
          import glob, xml.etree.ElementTree as ET
          files = sorted(glob.glob('app/build/test-results/testDebugUnitTest/*.xml'))
          t = f = e = s = 0
          for p in files:
              r = ET.parse(p).getroot()
              t += int(r.get('tests', 0)); f += int(r.get('failures', 0))
              e += int(r.get('errors', 0)); s += int(r.get('skipped', 0))
          print(f"classes={len(files)} tests={t} failures={f} errors={e} skipped={s}")
          PY
          sha256sum device-apks/*.apk >> artifacts/SHA256SUMS.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: WalkStrategy-build-${{ github.sha }}
          path: |
            artifacts/
            app/build/test-results/testDebugUnitTest/
          if-no-files-found: warn
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: WalkStrategy-device-apks
          path: device-apks/

  device:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: WalkStrategy-device-apks
          path: device-apks/
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run walk strategy device test
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 2
          ram-size: 3072M
          disk-size: 8G
          emulator-options: -no-window -gpu swiftshader -no-snapshot -noaudio -no-boot-anim -no-metrics
          disable-animations: true
          # 逻辑全在 tools/run-walk-strategy-evidence.sh 里，这里只留一行：
          # android-emulator-runner 用 `/usr/bin/sh`（dash）**逐行**执行，
          # 跨行 `if ... fi` 会直接语法错误（run 45372299838），
          # `INSTRUMENT_EXIT=$?` 也拿不到上一行的退出码。
          # 退出码契约 0/1/2 由脚本自己判定，有单测钉住。
          script: OUT_DIR=device-results bash tools/run-walk-strategy-evidence.sh
      - name: Summarise
        if: always()
        run: |
          mkdir -p device-results
          {
            echo "## Walk strategy device verification"
            echo ""
            echo "Emulator: API 36 / google_apis / x86_64 / pixel_6"
            echo ""
            echo '```'
            cat device-results/display.txt 2>/dev/null || true
            cat device-results/summary.txt 2>/dev/null || cat device-results/instrumentation.txt 2>/dev/null || echo "no instrumentation output"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: WalkStrategy-device-results
          path: device-results/
          if-no-files-found: warn
